<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 학술 발표 AI 실전 점검</title>
    <!-- PDF 저장을 위한 html2pdf 라이브러리 연동 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: #2c3e50;
        }
        .guide-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn { background-color: #3498db; color: white; }
        #startBtn:disabled { background-color: #bdc3c7; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:disabled { background-color: #bdc3c7; }
        
        #status {
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #e67e22;
        }
        #transcript-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            min-height: 80px;
            font-size: 15px;
            line-height: 1.4;
        }
        #result-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: none;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .feedback-content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }
        #pdfBtn {
            background-color: #27ae60;
            color: white;
            margin-top: 15px;
            width: 100%;
        }
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>미디어·문화 전공 학술 발표 실전 점검</h1>
    
    <div class="guide-box">
        <strong>[안내]</strong> 분당 200~250음절의 적정 속도를 유지하고, 수업 시간에 배운 <strong>발표 주제 소개, 자료 출처 밝히기, 대조·비교, 담화 표지</strong> 등의 필수 표현을 활용하여 녹음을 진행해 주세요!
    </div>

    <div class="btn-container">
        <button id="startBtn" onclick="startRecording()">녹음 시작</button>
        <button id="stopBtn" onclick="stopRecording()" disabled>녹음 종료 및 평가</button>
    </div>

    <div id="status">대기 중...</div>

    <div>
        <strong>[실시간 음성 인식 텍스트]</strong>
        <div id="transcript-container">녹음된 내용이 여기에 표시됩니다...</div>
    </div>

    <div id="result-area">
        <div class="result-title">AI 실전 평가 리포트</div>
        <div id="feedback" class="feedback-content"></div>
        <button id="pdfBtn" onclick="downloadPDF()">PDF로 결과 저장하기</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6LnrKVwBMYH2lN2pFHuVYZJdVshNeQgaQqlaGJgqsGtGQ"; // 본인의 API 키 입력

        let recognition;
        let finalTranscript = '';
        let startTime = 0;
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const transcriptContainer = document.getElementById('transcript-container');
        const resultArea = document.getElementById('result-area');
        const feedbackDiv = document.getElementById('feedback');

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                transcriptContainer.innerText = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = "음성 인식 오류 발생: " + event.error;
                resetButtons();
            };
        } else {
            alert("이 브라우저는 음성 인식을 지원하지 않습니다. 크롬(Chrome) 브라우저를 이용해 주세요.");
        }

        function startRecording() {
            if (!recognition) return;
            finalTranscript = '';
            transcriptContainer.innerText = '';
            feedbackDiv.innerText = '';
            resultArea.style.display = 'none';
            
            startTime = Date.now();
            recognition.start();
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDiv.innerText = "녹음 중... 마이크를 보고 발표해 주세요.";
        }

        function stopRecording() {
            if (!recognition) return;
            recognition.stop();
            
            const elapsedTimeSec = (Date.now() - startTime) / 1000;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.innerText = "AI가 발표 내용 및 표현을 분석 중입니다...";
            
            if (!finalTranscript.trim()) {
                statusDiv.innerText = "인식된 음성이 없습니다. 다시 시도해 주세요.";
                return;
            }

            const cleanText = finalTranscript.replace(/\s+/g, '');
            const characterCount = cleanText.length;
            
            let spm = 0;
            if (elapsedTimeSec > 0) {
                spm = Math.round((characterCount / elapsedTimeSec) * 60);
            }

            evaluateWithGemini(finalTranscript, spm, Math.round(elapsedTimeSec));
        }

        function resetButtons() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        async function evaluateWithGemini(transcript, spm, durationSec) {
            feedbackDiv.innerHTML = '<div class="loading">평가 리포트를 생성하는 중입니다...</div>';
            resultArea.style.display = 'block';

            const systemInstruction = `
당신은 한국어 학술 발표(미디어·문화 전공) 평가 전문 AI 조교입니다.
학생의 발표 텍스트와 발화 데이터를 분석하여 아래 기준에 따라 건설적인 피드백과 가점을 부여해주세요.

[평가 및 가점 기준]
1. 발화 속도:
   - 이상적인 학술 발표 속도는 '분당 200~250음절(SPM)'입니다.
   - 학생의 실제 측정 속도는 분당 ${spm}음절 (총 발표 시간 약 ${durationSec}초)입니다. 속도의 적절성을 평가해주세요.
2. 수업 핵심 표현 및 담화 표지 활용 (가점 부여 요소):
   - 교재에서 학습한 다음 필수 표현들이 발표에 자연스럽게 녹아들었는지 확인하고, 사용된 경우 적극적으로 칭찬하고 **가점**을 부여해주세요.
     * [발표 주제 소개 / 개요 제시]: "제 발표 주제는~", "오늘 발표할 내용은 먼저~" 등
     * [자료 출처 밝히기]: "~에 따르면[의하면]~", "~에서 ~을 대상으로 조사한 결과~" 등
     * [자료 분석 및 의견 정리]: "~을 차지하다", "~에 이르다", "먼저 ~다는 의견이 있다. 반면에~" 등
     * [비교 및 대조]: "~와 마찬가지로", "~과 달리", "~는 반면에" 등
     * [다음 항목 전환 및 결론]: "다음으로 ~을 살펴보겠습니다", "지금까지 말씀드린 것을 통해 ~다는 결론을 내릴 수 있습니다" 등
3. 수치 데이터 및 논리성: 통계 수치나 데이터가 정확히 제시되고 논리적으로 다뤄졌는지 평가합니다.
4. 군말 및 유창성: '어', '음', '그니까' 같은 군말을 점검하되, 유학생들의 미세한 발음 오류(예: 예사소리의 거센소리화 등)나 띄어쓰기 차이는 관대하게 넘어가고 부드럽게 교정 제안을 주세요.

출력 형식은 마크다운을 사용하여 가독성 좋게 작성해주세요.
`;

            const prompt = `다음은 학생의 발표 음성 데이터입니다. 평가를 진행해주세요:\n\n- 변환된 텍스트: "${transcript}"\n- 총 발표 시간: ${durationSec}초\n- 발화 속도: 분당 ${spm}음절 (SPM)`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    feedbackDiv.innerText = aiReply;
                    statusDiv.innerText = "분석 완료!";
                } else {
                    feedbackDiv.innerText = "AI 응답을 받아오지 못했습니다. API 키를 확인해주세요.";
                    statusDiv.innerText = "오류 발생";
                }
            } catch (error) {
                console.error(error);
                feedbackDiv.innerText = "통신 중 오류가 발생했습니다.";
                statusDiv.innerText = "통신 오류";
            }
        }

        function downloadPDF() {
            const element = document.getElementById('result-area');
            const pdfBtn = document.getElementById('pdfBtn');
            pdfBtn.style.display = 'none';

            const opt = {
                margin:       10,
                filename:     '한국어_학술발표_평가결과.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                pdfBtn.style.display = 'block';
            });
        }
    </script>
</body>
</html>
