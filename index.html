<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학술 발표 연습기 - Academic Speech Coach</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; background-color: #f8fafc; }
        .recording-pulse {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .markdown-body h3 { font-size: 1.125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #1e293b; }
        .markdown-body p { margin-bottom: 0.5rem; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body strong { color: #3b82f6; }
        
        /* Toast Notification */
        #toast-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 0.75rem 1.5rem; border-radius: 9999px; color: white; font-weight: 500; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-20px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: #ef4444; }
        .toast.success { background-color: #10b981; }
        .toast.info { background-color: #3b82f6; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Header -->
    <header class="bg-white shadow-sm shrink-0 z-10 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-microphone-lines"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">학술 발표 연습기</h1>
                    <p class="text-xs text-slate-500">실시간 STT 및 AI 피드백 시스템</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="btnPdf" class="hidden bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    <i class="fa-solid fa-file-pdf mr-2"></i>PDF 저장
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" id="report-container">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
            
            <!-- Left Column: Controls & Transcript -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                
                <!-- Controls Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <button id="btnStart" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-play"></i> 발표 시작
                            </button>
                            <button id="btnStop" class="hidden bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-semibold transition-colors flex items-center gap-2">
                                <i class="fa-solid fa-stop"></i> 발표 종료
                            </button>
                        </div>
                        
                        <!-- Status Indicator -->
                        <div id="statusIndicator" class="flex items-center gap-2 text-sm font-medium text-slate-500">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-300" id="statusDot"></span>
                            <span id="statusText">대기 중</span>
                        </div>
                    </div>

                    <!-- Audio Player (Hidden initially) -->
                    <div id="audioPlayerContainer" class="hidden mt-6 pt-4 border-t border-slate-100">
                        <p class="text-sm font-semibold text-slate-700 mb-2">다시 듣기</p>
                        <audio id="audioPlayback" controls class="w-full h-10 rounded-lg outline-none"></audio>
                    </div>
                </div>

                <!-- Stats Card -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4">
                        <div class="bg-indigo-100 text-indigo-600 w-12 h-12 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-regular fa-clock"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">발표 시간</p>
                            <p class="text-2xl font-bold text-slate-800" id="statTime">00:00</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex items-center gap-4">
                        <div class="bg-emerald-100 text-emerald-600 w-12 h-12 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-gauge-high"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">발표 속도</p>
                            <p class="text-2xl font-bold text-slate-800" id="statSpeed">0 <span class="text-sm font-normal text-slate-500">자/분</span></p>
                        </div>
                    </div>
                </div>

                <!-- Transcript Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 flex-1 flex flex-col min-h-[300px]">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                        <h2 class="font-semibold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-align-left text-slate-400"></i> 실시간 스크립트
                        </h2>
                    </div>
                    <div class="p-6 flex-1 overflow-y-auto bg-white rounded-b-2xl relative">
                        <div id="transcriptText" class="text-slate-700 leading-relaxed whitespace-pre-wrap">발표를 시작하면 스크립트가 여기에 작성됩니다...</div>
                        <div id="interimText" class="text-slate-400 italic mt-2"></div>
                    </div>
                </div>

            </div>

            <!-- Right Column: AI Feedback -->
            <div class="lg:col-span-5 flex flex-col h-full min-h-[500px]">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 flex-1 flex flex-col relative overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                        <h2 class="font-semibold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i> AI 학술 평가 (Gemini)
                        </h2>
                    </div>
                    
                    <div class="p-6 flex-1 overflow-y-auto markdown-body" id="aiFeedbackContainer">
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 text-center gap-3">
                            <i class="fa-solid fa-microscope text-4xl mb-2 text-slate-200"></i>
                            <p>발표가 종료되면 AI가 스크립트를 분석하여<br>담화 표지와 학술적 표현을 평가합니다.</p>
                        </div>
                    </div>

                    <!-- Loading Overlay -->
                    <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/90 flex flex-col items-center justify-center z-10 backdrop-blur-sm">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-purple-600 mb-4"></i>
                        <p class="text-slate-800 font-medium">Gemini가 발표를 분석 중입니다...</p>
                        <p class="text-slate-500 text-sm mt-1">담화 표지 및 학술적 표현 검토 중</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // --- State Variables ---
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;
        let finalTranscript = '';
        
        let startTime = null;
        let timerInterval = null;
        
        // --- DOM Elements ---
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnPdf = document.getElementById('btnPdf');
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        
        const transcriptText = document.getElementById('transcriptText');
        const interimText = document.getElementById('interimText');
        
        const statTime = document.getElementById('statTime');
        const statSpeed = document.getElementById('statSpeed');
        
        const audioPlayerContainer = document.getElementById('audioPlayerContainer');
        const audioPlayback = document.getElementById('audioPlayback');
        
        const aiFeedbackContainer = document.getElementById('aiFeedbackContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // --- Toast Notification System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3s
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Web Speech API Initialization ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.", "error");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'ko-KR'; // 한국어 설정

            rec.onstart = () => {
                console.log("Speech recognition started.");
            };

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                        transcriptText.textContent = finalTranscript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                interimText.textContent = interim;
                updateStats();
            };

            rec.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                if (event.error === 'not-allowed') {
                    showToast("마이크 권한이 거부되었습니다.", "error");
                    stopRecordingProcess(true);
                }
            };

            rec.onend = () => {
                // 무음 등으로 인해 자동 종료된 경우, 녹음 상태면 재시작
                if (isRecording) {
                    console.log("Restarting speech recognition due to pause...");
                    try {
                        rec.start();
                    } catch(e) {
                        console.error("Failed to restart recognition", e);
                    }
                }
            };

            return rec;
        }

        // --- Timer and Stats Update ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateStats() {
            if (!startTime) return;
            const now = new Date();
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            statTime.textContent = formatTime(elapsedSeconds);

            // Calculate Speed (Characters per Minute)
            // 공백 제외 글자 수 계산
            const charCount = finalTranscript.replace(/\s/g, '').length;
            let cpm = 0;
            if (elapsedSeconds > 0) {
                cpm = Math.floor((charCount / elapsedSeconds) * 60);
            }
            statSpeed.innerHTML = `${cpm} <span class="text-sm font-normal text-slate-500">자/분</span>`;
        }

        // --- Start Recording ---
        btnStart.addEventListener('click', async () => {
            try {
                // 1. Request Microphone Permission ON CLICK
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 2. Initialize MediaRecorder
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    audioPlayerContainer.classList.remove('hidden');
                    
                    // Stop tracks to release mic
                    stream.getTracks().forEach(track => track.stop());
                };

                // 3. Initialize Speech Recognition
                finalTranscript = '';
                transcriptText.textContent = '';
                interimText.textContent = '';
                aiFeedbackContainer.innerHTML = ''; // Clear previous feedback
                btnPdf.classList.add('hidden');
                
                recognition = setupSpeechRecognition();
                if (!recognition) return;

                // 4. Start everything
                mediaRecorder.start();
                recognition.start();
                
                isRecording = true;
                startTime = new Date();
                
                // 5. Update UI
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
                statusDot.classList.remove('bg-slate-300');
                statusDot.classList.add('bg-red-500', 'recording-pulse');
                statusText.textContent = '녹음 및 인식 중...';
                statusText.classList.add('text-red-500');
                audioPlayerContainer.classList.add('hidden');
                
                // Start Timer
                timerInterval = setInterval(updateStats, 1000);
                showToast("발표 연습을 시작합니다.", "success");

            } catch (err) {
                console.error(err);
                showToast("마이크 접근 권한이 필요합니다.", "error");
            }
        });

        // --- Stop Recording Process ---
        function stopRecordingProcess(isError = false) {
            if (!isRecording) return;
            isRecording = false;

            // Stop Timer
            clearInterval(timerInterval);

            // Stop Recorder
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            // Stop Recognition
            if (recognition) {
                recognition.stop();
            }

            // Update UI
            btnStop.classList.add('hidden');
            btnStart.classList.remove('hidden');
            btnStart.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 다시 연습하기';
            statusDot.classList.remove('bg-red-500', 'recording-pulse');
            statusDot.classList.add('bg-slate-300');
            statusText.textContent = '종료됨';
            statusText.classList.remove('text-red-500');
            interimText.textContent = '';

            if (!isError && finalTranscript.trim().length > 0) {
                analyzeWithGemini(finalTranscript);
            } else if (!isError) {
                showToast("녹음된 음성이 없거나 스크립트가 짧습니다.", "info");
                aiFeedbackContainer.innerHTML = '<p class="text-center text-slate-500 mt-10">스크립트가 부족하여 분석을 건너뛰었습니다.</p>';
            }
        }

        btnStop.addEventListener('click', () => stopRecordingProcess(false));

        // --- Gemini API Integration ---
        async function analyzeWithGemini(scriptText) {
            loadingOverlay.classList.remove('hidden');
            
            const apiKey = "AQ.Ab8RN6LnrKVwBMYH2lN2pFHuVYZJdVshNeQgaQqlaGJgqsGtGQ"; // API Key injected automatically in this environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `
당신은 대학 및 대학원 수준의 '학술 발표(Academic Presentation)'를 지도하는 전문 코치입니다.
사용자의 발표 스크립트가 주어지면 다음 세 가지 기준에 따라 꼼꼼하게 평가하고 마크다운 형식으로 응답하세요.

1. **핵심 담화 표지 (Discourse Markers)**
   - 도입, 전환, 강조, 예시, 결론 등을 나타내는 표지(예: 첫째로, 이와 관련하여, 선행 연구에 따르면, 결론적으로 등)가 적절히 사용되었는지 분석.
   - 부족한 경우 추천 표현 제시.

2. **학술적 표현 (Academic Expressions)**
   - 구어체나 비격식적 표현이 섞여 있는지 확인.
   - 객관적이고 논리적인 어휘/표현(예: ~라고 생각한다 -> ~임을 시사한다, 엄청 많다 -> 유의미한 차이가 있다 등)으로 교정.

3. **종합 피드백 (Overall Feedback)**
   - 말하기 속도감, 논리 전개 방식에 대한 칭찬과 개선점 요약.

결과는 읽기 쉽게 제목, 글머리 기호를 활용하여 마크다운으로 깔끔하게 작성해주세요.
`;

            const payload = {
                contents: [{
                    parts: [{ text: `[발표 스크립트]\n${scriptText}` }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            try {
                // Implementing exponential backoff logic (simplified for immediate response but robust)
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const result = await response.json();
                const candidate = result.candidates?.[0];
                
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    
                    // Parse Markdown to HTML
                    aiFeedbackContainer.innerHTML = marked.parse(text);
                    btnPdf.classList.remove('hidden'); // Show PDF button after successful analysis
                    showToast("AI 분석이 완료되었습니다.", "success");
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                aiFeedbackContainer.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-lg flex items-start gap-3">
                        <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                        <div>
                            <p class="font-bold">분석 중 오류가 발생했습니다.</p>
                            <p class="text-sm mt-1">잠시 후 다시 시도해 주세요.</p>
                        </div>
                    </div>
                `;
                showToast("분석 요청 실패", "error");
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // --- PDF Generation ---
        btnPdf.addEventListener('click', () => {
            const element = document.getElementById('report-container');
            const opt = {
                margin:       10,
                filename:     `학술발표_리포트_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            showToast("PDF 생성을 시작합니다...", "info");
            
            // Add a temporary class to fix layouts for printing if needed
            element.classList.add('pdf-mode');
            
            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
                showToast("PDF가 저장되었습니다.", "success");
            });
        });

    </script>
</body>
</html>
