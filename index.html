<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학술 발표 연습기 - Academic Speech Coach</title>
    
    <!-- Favicon 404 에러 방지 -->
    <link rel="icon" href="data:,">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* CSS Variables for Theme */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --dark: #1e293b;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --white: #ffffff;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* Reset & Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Pretendard', sans-serif; background-color: var(--gray-50); color: var(--gray-800); display: flex; flex-direction: column; height: 100vh; overflow: hidden; line-height: 1.5; }
        input, button { font-family: inherit; font-size: inherit; }
        button { cursor: pointer; border: none; background: none; }
        
        /* Layout */
        .header { background-color: var(--white); box-shadow: var(--shadow-sm); z-index: 10; flex-shrink: 0; }
        .header-content { max-w: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .header-title-group { display: flex; align-items: center; gap: 0.75rem; }
        .header-icon { background-color: var(--primary); color: var(--white); padding: 0.5rem 0.6rem; border-radius: 0.5rem; font-size: 1.25rem; }
        .header-title { font-size: 1.25rem; font-weight: 700; color: var(--gray-800); line-height: 1.2; }
        .header-subtitle { font-size: 0.75rem; color: var(--gray-500); }
        .header-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        
        .api-input-group { display: flex; align-items: center; gap: 0.5rem; background: var(--gray-100); padding: 0.25rem 0.5rem; border-radius: 0.5rem; border: 1px solid var(--gray-200); }
        .api-input-group i { color: var(--gray-500); font-size: 0.875rem; }
        .api-input-group input { background: transparent; border: none; outline: none; padding: 0.25rem; font-size: 0.875rem; width: 180px; color: var(--gray-700); }
        
        .main-container { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .grid-layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 1.5rem; min-height: 100%; }
        @media (min-width: 1024px) {
            .grid-layout { grid-template-columns: 7fr 5fr; }
        }

        .column { display: flex; flex-direction: column; gap: 1.5rem; }

        /* Components */
        .card { background-color: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100); padding: 1.5rem; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--gray-100); background-color: var(--gray-50); border-radius: var(--radius-xl) var(--radius-xl) 0 0; display: flex; justify-content: space-between; align-items: center; margin: -1.5rem -1.5rem 1.5rem -1.5rem; }
        .card-header h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        
        .card-body-scroll { flex: 1; overflow-y: auto; position: relative; min-height: 250px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.2s; font-size: 0.875rem; }
        .btn-lg { padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: var(--radius-lg); font-weight: 600; }
        .btn-primary { background-color: var(--primary); color: var(--white); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: var(--white); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-dark { background-color: var(--gray-800); color: var(--white); }
        .btn-dark:hover { background-color: #0f172a; }
        .hidden { display: none !important; }

        /* Specific Elements */
        .controls-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
        .status-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; color: var(--gray-500); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--gray-300); }
        .status-dot.recording { background-color: var(--danger); animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .status-text.recording { color: var(--danger); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .stat-card { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; }
        .stat-icon { width: 3rem; height: 3rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .stat-icon.time { background-color: #e0e7ff; color: #4f46e5; }
        .stat-icon.speed { background-color: #d1fae5; color: #059669; }
        .stat-label { font-size: 0.875rem; color: var(--gray-500); font-weight: 500; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--gray-800); }
        .stat-unit { font-size: 0.875rem; font-weight: 400; color: var(--gray-500); }

        .transcript-container { display: flex; flex-direction: column; height: 100%; min-height: 350px; }
        #transcriptText { color: var(--gray-700); white-space: pre-wrap; margin-bottom: 0.5rem; }
        #interimText { color: var(--gray-400); font-style: italic; }

        .feedback-container { display: flex; flex-direction: column; height: 100%; min-height: 500px; position: relative; }
        .placeholder-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--gray-400); text-align: center; gap: 1rem; min-height: 300px; }
        .placeholder-box i { font-size: 3rem; color: var(--gray-200); }
        
        .audio-player-wrapper { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--gray-100); }
        .audio-player-wrapper p { font-size: 0.875rem; font-weight: 600; color: var(--gray-700); margin-bottom: 0.5rem; }
        audio { width: 100%; height: 40px; border-radius: 0.5rem; outline: none; }

        /* Loading Overlay */
        .loading-overlay { position: absolute; inset: 0; background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
        .loading-spinner { font-size: 2.5rem; color: #9333ea; margin-bottom: 1rem; animation: spin 1s linear infinite; }
        .loading-title { font-weight: 600; color: var(--gray-800); }
        .loading-subtitle { font-size: 0.875rem; color: var(--gray-500); margin-top: 0.25rem; }

        /* Markdown Styles */
        .markdown-body { padding-right: 0.5rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; color: var(--gray-800); margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body h3 { font-size: 1.125rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body li { margin-bottom: 0.25rem; }
        .markdown-body strong { color: var(--primary); font-weight: 600; }
        .markdown-body blockquote { border-left: 4px solid var(--gray-300); padding-left: 1rem; color: var(--gray-500); margin-bottom: 1rem; }
        
        /* Toast Notifications */
        #toast-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 0.75rem 1.5rem; border-radius: 2rem; color: white; font-weight: 500; font-size: 0.875rem; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-20px); box-shadow: var(--shadow-md); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background-color: var(--danger); }
        .toast.success { background-color: var(--success); }
        .toast.info { background-color: var(--primary); }

        /* Animations */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* PDF Export Adjustments */
        .pdf-mode { height: auto !important; overflow: visible !important; background: white; }
        .pdf-mode .grid-layout { display: block; }
        .pdf-mode .column { display: block; }
        .pdf-mode .card { box-shadow: none; border: 1px solid #ccc; margin-bottom: 2rem; page-break-inside: avoid; }
        .pdf-mode .card-body-scroll { min-height: auto; overflow: visible; }
    </style>
</head>
<body>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-title-group">
                <div class="header-icon">
                    <i class="fa-solid fa-microphone-lines"></i>
                </div>
                <div>
                    <h1 class="header-title">학술 발표 연습기</h1>
                    <p class="header-subtitle">실시간 STT 및 AI 피드백 시스템 (Vanilla CSS)</p>
                </div>
            </div>
            <div class="header-controls">
                <!-- API Key Input -->
                <div class="api-input-group" title="자신의 Gemini API Key가 있다면 입력하세요. 없으면 기본 시스템 환경을 사용합니다.">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="apiKeyInput" placeholder="Gemini API Key (선택사항)">
                </div>
                <!-- PDF Button -->
                <button id="btnPdf" class="btn btn-dark hidden">
                    <i class="fa-solid fa-file-pdf"></i> PDF 저장
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container" id="report-container">
        <div class="grid-layout">
            
            <!-- Left Column: Controls & Transcript -->
            <div class="column">
                
                <!-- Controls Card -->
                <div class="card">
                    <div class="controls-row">
                        <div>
                            <button id="btnStart" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-play"></i> 발표 시작
                            </button>
                            <button id="btnStop" class="btn btn-danger btn-lg hidden">
                                <i class="fa-solid fa-stop"></i> 발표 종료
                            </button>
                        </div>
                        
                        <!-- Status Indicator -->
                        <div class="status-indicator">
                            <span class="status-dot" id="statusDot"></span>
                            <span id="statusText">대기 중</span>
                        </div>
                    </div>

                    <!-- Audio Player (Hidden initially) -->
                    <div id="audioPlayerContainer" class="audio-player-wrapper hidden">
                        <p>다시 듣기</p>
                        <audio id="audioPlayback" controls></audio>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="card stat-card" style="padding: 1.25rem;">
                        <div class="stat-icon time"><i class="fa-regular fa-clock"></i></div>
                        <div>
                            <div class="stat-label">발표 시간</div>
                            <div class="stat-value" id="statTime">00:00</div>
                        </div>
                    </div>
                    <div class="card stat-card" style="padding: 1.25rem;">
                        <div class="stat-icon speed"><i class="fa-solid fa-gauge-high"></i></div>
                        <div>
                            <div class="stat-label">발표 속도</div>
                            <div class="stat-value" id="statSpeed">0 <span class="stat-unit">자/분 (CPM)</span></div>
                        </div>
                    </div>
                </div>

                <!-- Transcript Card -->
                <div class="card transcript-container">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-align-left" style="color: var(--gray-400);"></i> 실시간 스크립트</h2>
                    </div>
                    <div class="card-body-scroll">
                        <div id="transcriptText">발표를 시작하면 스크립트가 여기에 작성됩니다...</div>
                        <div id="interimText"></div>
                    </div>
                </div>

            </div>

            <!-- Right Column: AI Feedback -->
            <div class="column">
                <div class="card feedback-container">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-wand-magic-sparkles" style="color: #a855f7;"></i> AI 학술 평가 (Gemini)</h2>
                    </div>
                    
                    <div class="card-body-scroll markdown-body" id="aiFeedbackContainer">
                        <div class="placeholder-box">
                            <i class="fa-solid fa-microscope"></i>
                            <p>발표가 종료되면 AI가 스크립트를 분석하여<br>담화 표지와 학술적 표현을 평가합니다.</p>
                        </div>
                    </div>

                    <!-- Loading Overlay -->
                    <div id="loadingOverlay" class="loading-overlay hidden">
                        <i class="fa-solid fa-circle-notch loading-spinner"></i>
                        <div class="loading-title">Gemini가 발표를 분석 중입니다...</div>
                        <div class="loading-subtitle">담화 표지 및 학술적 표현 검토 중</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // --- State Variables ---
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;
        let finalTranscript = '';
        
        let startTime = null;
        let timerInterval = null;
        
        // --- DOM Elements ---
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnPdf = document.getElementById('btnPdf');
        const apiKeyInput = document.getElementById('apiKeyInput');
        
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        
        const transcriptText = document.getElementById('transcriptText');
        const interimText = document.getElementById('interimText');
        
        const statTime = document.getElementById('statTime');
        const statSpeed = document.getElementById('statSpeed');
        
        const audioPlayerContainer = document.getElementById('audioPlayerContainer');
        const audioPlayback = document.getElementById('audioPlayback');
        
        const aiFeedbackContainer = document.getElementById('aiFeedbackContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // --- Toast Notification System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3s
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Web Speech API Initialization ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.", "error");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'ko-KR'; // 한국어 설정

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                        transcriptText.textContent = finalTranscript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                interimText.textContent = interim;
                updateStats();
            };

            rec.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                if (event.error === 'not-allowed') {
                    showToast("마이크 권한이 거부되었습니다. 브라우저 설정을 확인하세요.", "error");
                    stopRecordingProcess(true);
                }
            };

            rec.onend = () => {
                // 무음 등으로 인해 자동 종료된 경우, 녹음 상태면 재시작하여 STT가 끊기지 않도록 함
                if (isRecording) {
                    try { rec.start(); } catch(e) { console.error("Failed to restart recognition", e); }
                }
            };

            return rec;
        }

        // --- Timer and Stats Update ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateStats() {
            if (!startTime) return;
            const now = new Date();
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            statTime.textContent = formatTime(elapsedSeconds);

            // CPM (Characters per Minute) 계산 - 공백 제외 글자 수
            const charCount = finalTranscript.replace(/\s/g, '').length;
            let cpm = 0;
            if (elapsedSeconds > 0) {
                cpm = Math.floor((charCount / elapsedSeconds) * 60);
            }
            statSpeed.innerHTML = `${cpm} <span class="stat-unit">자/분 (CPM)</span>`;
        }

        // --- Start Recording ---
        btnStart.addEventListener('click', async () => {
            try {
                // 1. Request Microphone Permission
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 2. Initialize MediaRecorder
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    audioPlayerContainer.classList.remove('hidden');
                    
                    // Stop tracks to release mic
                    stream.getTracks().forEach(track => track.stop());
                };

                // 3. Initialize Speech Recognition
                finalTranscript = '';
                transcriptText.textContent = '';
                interimText.textContent = '';
                aiFeedbackContainer.innerHTML = ''; 
                btnPdf.classList.add('hidden');
                
                recognition = setupSpeechRecognition();
                if (!recognition) return;

                // 4. Start operations
                mediaRecorder.start();
                recognition.start();
                
                isRecording = true;
                startTime = new Date();
                
                // 5. Update UI
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
                statusDot.classList.add('recording');
                statusText.classList.add('recording');
                statusText.textContent = '녹음 및 인식 중...';
                audioPlayerContainer.classList.add('hidden');
                
                // Start Timer
                timerInterval = setInterval(updateStats, 1000);
                showToast("발표 연습을 시작합니다.", "success");

            } catch (err) {
                console.error("Mic access denied:", err);
                showToast("마이크 접근 권한이 필요합니다.", "error");
            }
        });

        // --- Stop Recording Process ---
        function stopRecordingProcess(isError = false) {
            if (!isRecording) return;
            isRecording = false;

            clearInterval(timerInterval);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (recognition) {
                recognition.stop();
            }

            // Update UI
            btnStop.classList.add('hidden');
            btnStart.classList.remove('hidden');
            btnStart.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 다시 연습하기';
            statusDot.classList.remove('recording');
            statusText.classList.remove('recording');
            statusText.textContent = '종료됨';
            interimText.textContent = '';

            if (!isError && finalTranscript.trim().length > 0) {
                analyzeWithGemini(finalTranscript);
            } else if (!isError) {
                showToast("녹음된 음성이 없거나 스크립트가 짧습니다.", "info");
                aiFeedbackContainer.innerHTML = '<div class="placeholder-box"><p>스크립트가 부족하여 분석을 건너뛰었습니다.</p></div>';
            }
        }

        btnStop.addEventListener('click', () => stopRecordingProcess(false));

        // --- Gemini API Integration ---
        async function analyzeWithGemini(scriptText) {
            loadingOverlay.classList.remove('hidden');
            
            // User API Key handling. If empty, platform default is used if applicable.
            const userKey = apiKeyInput.value.trim();
            const apiKey = userKey || "AQ.Ab8RN6LnrKVwBMYH2lN2pFHuVYZJdVshNeQgaQqlaGJgqsGtGQ"; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `
당신은 대학 및 대학원 수준의 '한국어 학술 발표(Academic Presentation)'를 지도하는 전문 코치입니다.
사용자의 발표 스크립트가 주어지면 다음 세 가지 기준에 따라 꼼꼼하게 평가하고 마크다운 형식으로 응답하세요.

1. **핵심 담화 표지 (Discourse Markers)**
   - 도입, 전환, 강조, 예시, 결론 등을 나타내는 표지(예: 첫째로, 이와 관련하여, 선행 연구에 따르면, 결론적으로 등)가 적절히 사용되었는지 분석. 부족한 경우 추천 표현 제시.

2. **학술적 표현 (Academic Expressions)**
   - 구어체나 비격식적 표현이 섞여 있는지 확인 및 객관적이고 논리적인 어휘로 교정. (예: 엄청 많다 -> 유의미한 차이가 있다)

3. **종합 피드백 (Overall Feedback)**
   - 논리 전개 방식에 대한 칭찬과 개선점 요약.

결과는 읽기 쉽게 제목, 글머리 기호를 활용하여 마크다운으로 깔끔하게 작성해주세요.
`;

            const payload = {
                contents: [{ parts: [{ text: `[발표 스크립트]\n${scriptText}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || 'API request failed');
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    aiFeedbackContainer.innerHTML = marked.parse(text);
                    btnPdf.classList.remove('hidden'); 
                    showToast("AI 분석이 완료되었습니다.", "success");
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                aiFeedbackContainer.innerHTML = `
                    <div style="background-color: var(--danger); color: white; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem;">
                        <strong>분석 중 오류가 발생했습니다.</strong><br>
                        <small>${error.message}</small><br>
                        <small>API Key가 올바른지 확인해 주세요.</small>
                    </div>
                `;
                showToast("AI 분석 요청 실패", "error");
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // --- PDF Generation ---
        btnPdf.addEventListener('click', () => {
            const element = document.getElementById('report-container');
            const opt = {
                margin:       10,
                filename:     `학술발표_리포트_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            showToast("PDF 생성을 시작합니다...", "info");
            element.classList.add('pdf-mode');
            
            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
                showToast("PDF가 저장되었습니다.", "success");
            });
        });

    </script>
