<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 학술 발표 AI 실전 점검</title>
    <!-- PDF 저장을 위한 html2pdf 라이브러리 연동 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: #2c3e50;
        }
        .guide-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn { background-color: #3498db; color: white; }
        #startBtn:disabled { background-color: #bdc3c7; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:disabled { background-color: #bdc3c7; }
        
        #status {
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #e67e22;
        }
        #transcript-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            min-height: 80px;
            font-size: 15px;
            line-height: 1.4;
        }
        /* PDF로 변환될 영역 스타일 */
        #result-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: none;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .feedback-content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }
        #pdfBtn {
            background-color: #27ae60;
            color: white;
            margin-top: 15px;
            width: 100%;
        }
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>미디어·문화 전공 학술 발표 실전 점검</h1>
    
    <div class="guide-box">
        <strong>[안내]</strong> 서론 발표 대본을 바탕으로 마이크 녹음을 시작하세요. 분당 200~250음절의 적정 속도를 유지하며, 통계 데이터와 학습한 담화 표지를 포함해 주세요!
    </div>

    <div class="btn-container">
        <button id="startBtn" onclick="startRecording()">녹음 시작</button>
        <button id="stopBtn" onclick="stopRecording()" disabled>녹음 종료 및 평가</button>
    </div>

    <div id="status">대기 중...</div>

    <div>
        <strong>[실시간 음성 인식 텍스트]</strong>
        <div id="transcript-container">녹음된 내용이 여기에 표시됩니다...</div>
    </div>

    <!-- PDF 저장 대상 영역 -->
    <div id="result-area">
        <div class="result-title">AI 실전 평가 리포트</div>
        <div id="feedback" class="feedback-content"></div>
        <button id="pdfBtn" onclick="downloadPDF()">PDF로 결과 저장하기</button>
    </div>

    <script>
        // API 키 설정 (여기에 본인의 Gemini API 키를 입력하세요)
        const API_KEY = "AQ.Ab8RN6LnrKVwBMYH2lN2pFHuVYZJdVshNeQgaQqlaGJgqsGtGQ"; 

        let recognition;
        let finalTranscript = '';
        let startTime = 0; // 녹음 시작 시간 기록용
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const transcriptContainer = document.getElementById('transcript-container');
        const resultArea = document.getElementById('result-area');
        const feedbackDiv = document.getElementById('feedback');

        // 웹 음성 인식(STT) 초기화
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                transcriptContainer.innerText = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = "음성 인식 오류 발생: " + event.error;
                resetButtons();
            };
        } else {
            alert("이 브라우저는 음성 인식을 지원하지 않습니다. 크롬(Chrome) 브라우저를 이용해 주세요.");
        }

        function startRecording() {
            if (!recognition) return;
            finalTranscript = '';
            transcriptContainer.innerText = '';
            feedbackDiv.innerText = '';
            resultArea.style.display = 'none';
            
            startTime = Date.now(); // 타이머 시작
            recognition.start();
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDiv.innerText = "녹음 중... 마이크를 보고 발표해 주세요.";
        }

        function stopRecording() {
            if (!recognition) return;
            recognition.stop();
            
            const elapsedTimeSec = (Date.now() - startTime) / 1000; // 총 녹음 소요 시간 (초)
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.innerText = "AI가 발표 내용 및 속도를 분석 중입니다...";
            
            if (!finalTranscript.trim()) {
                statusDiv.innerText = "인식된 음성이 없습니다. 다시 시도해 주세요.";
                return;
            }

            // 글자 수 계산 (공백 제외 한글/영문 글자 수 기반 음절 추정)
            const cleanText = finalTranscript.replace(/\s+/g, '');
            const characterCount = cleanText.length;
            
            // 분당 음절 수(SPM) 계산 공식: (총 글자 수 / 소요 시간(초)) * 60
            let spm = 0;
            if (elapsedTimeSec > 0) {
                spm = Math.round((characterCount / elapsedTimeSec) * 60);
            }

            evaluateWithGemini(finalTranscript, spm, Math.round(elapsedTimeSec));
        }

        function resetButtons() {
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        // Gemini API 호출 및 발화 속도(200~250 기준) 반영 프롬프트
        async function evaluateWithGemini(transcript, spm, durationSec) {
            feedbackDiv.innerHTML = '<div class="loading">평가 리포트를 생성하는 중입니다...</div>';
            resultArea.style.display = 'block';

            const systemInstruction = `
당신은 한국어 학술 발표(미디어·문화 전공) 평가 전문 AI 조교입니다.
학생의 발표 텍스트와 발화 속도 데이터를 분석하여 아래 기준에 따라 피드백을 제공해주세요.

[평가 기준]
1. 발화 속도 (매우 중요):
   - 학술 발표의 가장 이상적인 속도는 '분당 200~250음절(SPM)'입니다.
   - 학생의 실제 측정 속도가 분당 ${spm}음절 (총 발표 시간 약 ${durationSec}초)으로 나타났습니다.
   - 이 속도가 200~250 범위 내에 있는지 평가하고, 너무 빠르거나 느린 경우 학술 발표 톤에 맞추어 조언해주세요.
2. 수치 데이터 정확도: 발표에 포함된 통계 수치나 데이터가 정확하게 제시되었는지 평가합니다.
3. 담화 표지 활용: 교재에서 학습한 학술적 담화 표지('본격적인 발표에 앞서', '이처럼', '요약하자면' 등) 활용 여부를 평가하고 가점을 부여합니다.
4. 군말 및 유창성: '어', '음', '그니까' 같은 습관성 군말을 점검하고 피드백합니다.
5. 발음 유의사항: ‘한국언론진흥재단’을 ‘한국 언론 진흥 재단’으로 발음하는 등의 띄어쓰기 차이는 관대하게 넘어가되, 유학생들의 예사소리 거센소리화('폰격적인' 등)나 의미 전달에 치명적인 오류만 부드럽게 교정 제안을 줍니다.

출력 형식은 마크다운을 사용하여 가독성 좋게 작성해주세요.
`;

            const prompt = `다음은 학생의 발표 음성 데이터입니다. 평가를 진행해주세요:\n\n- 변환된 텍스트: "${transcript}"\n- 총 발표 시간: ${durationSec}초\n- 계산된 발화 속도: 분당 ${spm}음절 (SPM)`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    feedbackDiv.innerText = aiReply;
                    statusDiv.innerText = "분석 완료!";
                } else {
                    feedbackDiv.innerText = "AI 응답을 받아오지 못했습니다. API 키를 확인해주세요.";
                    statusDiv.innerText = "오류 발생";
                }
            } catch (error) {
                console.error(error);
                feedbackDiv.innerText = "통신 중 오류가 발생했습니다.";
                statusDiv.innerText = "통신 오류";
            }
        }

        // PDF 다운로드 함수
        function downloadPDF() {
            const element = document.getElementById('result-area');
            const pdfBtn = document.getElementById('pdfBtn');
            pdfBtn.style.display = 'none';

            const opt = {
                margin:       10,
                filename:     '한국어_학술발표_평가결과.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                pdfBtn.style.display = 'block';
            });
        }
    </script>
</body>
</html>
